# List of plugins

set -g @plugin 'tmux-plugins/tpm'

# set -g @plugin 'jimeh/tmux-themepack'
# set -g @plugin 'dracula/tmux'
set -g @plugin "arcticicestudio/nord-tmux"
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# tmux-continuum MUST be the last plugin: it appends its auto-save hook to
# status-right, so any theme (nord-tmux) that sets status-right must load first,
# otherwise the theme overwrites the hook and auto-save silently stops.
set -g @plugin 'tmux-plugins/tmux-continuum'

# set -g @themepack 'default'
set -g @continuum-save-interval '1'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
setw -g mode-keys vi

set-option -sa terminal-features ',xterm-256color:RGB'
set-option -sa terminal-features ',xterm-ghostty:RGB'
#set -g @dracula-show-left-icon session
#set -g @dracula-border-contrast true

# Initialize TPM plugin manager
run '~/.tmux/plugins/tpm/tpm'

