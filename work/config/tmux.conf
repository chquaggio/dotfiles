# List of plugins

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# fills #{prefix_highlight} in the tokyonight status-right below
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# tmux-continuum MUST be the last plugin: it appends its auto-save hook to
# status-right, so the theme that sets status-right (tokyonight, below) must be
# sourced before TPM runs, otherwise it overwrites the hook and auto-save stops.
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-save-interval '1'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
setw -g mode-keys vi

set-option -sa terminal-features ',xterm-256color:RGB'
set-option -sa terminal-features ',xterm-ghostty:RGB'

# Theme: the tmux colours shipped with tokyonight.nvim, so tmux follows the nvim
# colorscheme (moon) and its updates. The file picks a 24h clock from this option.
set -g clock-mode-style 24
source-file -q ~/.local/share/nvim/lazy/tokyonight.nvim/extras/tmux/tokyonight_moon.tmux

# Initialize TPM plugin manager
run '~/.tmux/plugins/tpm/tpm'
